name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_dependencies:
        description: "Nur native Wartungs-Locks erzeugen; keine Produktinstallation"
        type: boolean
        default: false
      container_only:
        description: "Nur native Containerproben; ersetzt keine vollständige Release-CI"
        type: boolean
        default: false
      windows_diagnostic_only:
        description: "Nur autorisierte C6-Desktopdiagnose; keine vollständige Paketabnahme"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.windows_diagnostic_only && 'windows-diagnostic' || inputs.prepare_dependencies && 'dependency-preparation' || inputs.container_only && 'container-probe' || 'full' }}
  cancel-in-progress: ${{ inputs.windows_diagnostic_only != true }}

jobs:
  dispatch-inputs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Reject conflicting partial validation modes
        env:
          PREPARE: ${{ inputs.prepare_dependencies }}
          CONTAINER_ONLY: ${{ inputs.container_only }}
          WINDOWS_DIAGNOSTIC_ONLY: ${{ inputs.windows_diagnostic_only }}
        run: |
          selected=0
          for mode in "$PREPARE" "$CONTAINER_ONLY" "$WINDOWS_DIAGNOSTIC_ONLY"; do
            if [ "$mode" = true ]; then selected=$((selected + 1)); fi
          done
          test "$selected" -le 1
  quality:
    if: inputs.prepare_dependencies != true && inputs.container_only != true && inputs.windows_diagnostic_only != true
    name: Quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: pip
      - name: Prepare private CPython security backport
        run: |
          python scripts/cpython_security.py clone --destination "$RUNNER_TEMP/einvoice-cpython-security" --output .cache/source-evidence/cpython-security.json
          echo "$RUNNER_TEMP/einvoice-cpython-security/bin" >> "$GITHUB_PATH"
      - name: Create fresh build environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - name: Install development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --force-reinstall -r packaging/python/requirements-source-release.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/dependency_lock.py verify --lock packaging/python/requirements-source-release.txt --installed
          python -m pip check
      - name: Verify versions
        run: python scripts/verify_version.py
      - name: Ruff lint
        run: python -m ruff check app tests scripts packaging/windows/verify_frozen_runtime.py
      - name: Ruff format
        run: python -m ruff format --check app tests scripts packaging/windows/verify_frozen_runtime.py
      - name: Mypy
        run: |
          python -m mypy
          python -m mypy scripts/dependency_lock.py scripts/dependency_audit.py scripts/acceptance_context.py scripts/test_container.py scripts/test_kosit_components.py scripts/check_source_artifacts.py scripts/docker_runtime_lock.py scripts/build_container_rootfs.py scripts/check_container_coverage.py scripts/test_container_runtime.py scripts/check_container_mounts.py scripts/cpython_security.py packaging/windows/verify_frozen_runtime.py
          python -m mypy scripts/processing_probe.py
          python -m mypy scripts/processing_smoke.py
          python -m mypy scripts/processing_lifecycle_probe.py
          python -m mypy scripts/test_processing_package.py
      - name: Tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Package metadata
        run: python -m pip check
      - name: Build and audit exact source release environment
        run: |
          python scripts/build_release.py
          python -m venv "$RUNNER_TEMP/einvoice-wheel-smoke"
          "$RUNNER_TEMP/einvoice-wheel-smoke/bin/python" -m pip install --force-reinstall --require-hashes --only-binary=:all: -r packaging/python/requirements-source-release.txt
          "$RUNNER_TEMP/einvoice-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          mkdir -p .cache/source-evidence
          python scripts/check_source_artifacts.py --dist dist --version "$(cat VERSION)" --wheel-smoke-python "$RUNNER_TEMP/einvoice-wheel-smoke/bin/python" > .cache/source-evidence/artifact-check.json
          python scripts/dependency_lock.py verify --lock packaging/python/requirements-source-release.txt --installed
          python scripts/dependency_audit.py capture --lock packaging/python/requirements-source-release.txt --output .cache/source-evidence/inventory.json
          python scripts/dependency_audit.py audit --inventory .cache/source-evidence/inventory.json --output .cache/source-evidence/audit.json
      - name: Preserve source build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-check-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 14
          path: |
            dist/*
            .cache/source-evidence/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  tests:
    if: inputs.prepare_dependencies != true && inputs.container_only != true && inputs.windows_diagnostic_only != true
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==84.0.0 wheel==0.48.0
          python -m pip install --no-build-isolation -e . pytest "httpx>=0.28.1,<1" "httpx2>=2.13,<3"
      - name: Run tests
        run: python -m pytest

  macos-processing:
    if: inputs.prepare_dependencies != true && inputs.container_only != true && inputs.windows_diagnostic_only != true
    name: Native macOS processing lifecycle
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Prepare native macOS source test environment
        run: |
          mkdir -p .cache/macos-processing
          python - <<'PY' > .cache/macos-processing/startup-inventory.json 2> .cache/macos-processing/preparation.stderr
          import json
          import os
          import platform
          import sys
          print(json.dumps({
              "schema_version": 1,
              "scope": "native macOS source processing probe; no release runtime backport receipt",
              "cpython_security_backport_applied": False,
              "github_context": {name: os.environ[name] for name in (
                  "GITHUB_REPOSITORY", "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB",
              )},
              "system": platform.system(),
              "machine": platform.machine(),
              "python_version": platform.python_version(),
              "python_executable": sys.executable,
              "python_base_prefix": sys.base_prefix,
          }, indent=2))
          PY
          python -m venv .venv > .cache/macos-processing/preparation.stdout 2>> .cache/macos-processing/preparation.stderr
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1 setuptools==84.0.0 wheel==0.48.0
          python -m pip install --no-build-isolation -e '.[dev]'
          python -m pip check
          python -m pip freeze --all > .cache/macos-processing/installed.txt
      - name: Record native address space baseline before limits
        run: |
          python - <<'PY' > .cache/macos-processing/native-baseline.json
          import json
          import platform
          import sys
          from app.processing.posix import virtual_memory_bytes
          print(json.dumps({
              "system": platform.system(),
              "machine": platform.machine(),
              "python_version": platform.python_version(),
              "python_build": platform.python_build(),
              "python_executable": sys.executable,
              "virtual_memory_bytes": virtual_memory_bytes(),
          }, indent=2))
          PY
      - name: Verify native macOS address space and heap enforcement
        timeout-minutes: 1
        run: >-
          python scripts/processing_probe.py --case address_space --case heap
          --output .cache/macos-processing/address-space.json
          > .cache/macos-processing/address-space.stdout
          2> .cache/macos-processing/address-space.stderr
      - name: Verify watchdog startup in inherited and new sessions
        timeout-minutes: 1
        run: >-
          python scripts/processing_watchdog_probe.py
          --output .cache/macos-processing/watchdog-startup.json
          > .cache/macos-processing/watchdog-startup.stdout
          2> .cache/macos-processing/watchdog-startup.stderr
      - name: Native bounded synthetic lifecycle tests
        run: >-
          python -m pytest --junitxml=.cache/macos-processing/tests.xml
          tests/test_upload_ingress.py tests/test_http_upload.py tests/test_http_transport.py
          tests/test_processing_protocol.py tests/test_processing_ready.py
          tests/test_processing_manager.py tests/test_processing_lifecycle.py
          tests/test_processing_faults.py
          tests/test_processing_shutdown.py tests/test_cli.py
          tests/test_processing_watchdog.py tests/test_processing_probe.py
          tests/test_processing_limits.py tests/test_processing_entrypoints.py
      - name: Complete native macOS processing catalog
        run: >-
          python scripts/processing_smoke.py
          --case small --case xml_25mib --case cii_large --case ubl_large --case hybrid_pdf --case parallel
          --output .cache/macos-processing/catalog.json
          > .cache/macos-processing/catalog.stdout
          2> .cache/macos-processing/catalog.stderr
      - name: Active native macOS cancellation and role-death catalog
        run: >-
          python scripts/processing_lifecycle_probe.py --output .cache/macos-processing/active-lifecycle.json
          > .cache/macos-processing/active-lifecycle.stdout
          2> .cache/macos-processing/active-lifecycle.stderr
      - name: Preserve native macOS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-processing-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: .cache/macos-processing/

  windows-diagnostic:
    needs: dispatch-inputs
    if: github.event_name == 'workflow_dispatch' && inputs.windows_diagnostic_only == true && inputs.prepare_dependencies != true && inputs.container_only != true
    name: Authorized original Desktop diagnostic
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      EINVOICE_WINDOWS_DIAGNOSTIC_ONLY: ${{ inputs.windows_diagnostic_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Reject any automatic retry or different diagnostic target
        run: python -c "from scripts.windows_package_diagnostic import diagnostic_environment; diagnostic_environment()"
      - name: Prepare private CPython security backport for the harness
        shell: pwsh
        run: |
          $privatePython = Join-Path $env:RUNNER_TEMP "einvoice-cpython-security"
          python scripts/cpython_security.py clone --destination $privatePython --output .cache/dependency-evidence/cpython-security.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $privatePython | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Create fresh diagnostic helper environment
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$env:GITHUB_WORKSPACE\.venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install locked helper dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --force-reinstall
          -r packaging/windows/requirements-release.txt &&
          python -m pip install --no-deps --no-build-isolation -e . &&
          python scripts/dependency_lock.py verify --lock packaging/windows/requirements-release.txt --installed &&
          python -m pip check
      - name: Verify diagnostic harness before any product installation
        run: >-
          python -m pytest tests/test_windows_package_diagnostic.py
          tests/test_processing_diagnostic_scope.py tests/test_processing_package.py
      - name: Retrieve and verify the exact original C6 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/windows_package_diagnostic.py prepare
      - name: Bind isolated diagnostic before product mutations
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/acceptance, .cache/acceptance-logs | Out-Null
          $root = ".cache/acceptance/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          $controller = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          python scripts/acceptance_context.py init-ci --root $root --controller $controller --version 2.0.3 --scope desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "EINVOICE_ACCEPTANCE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EINVOICE_ACCEPTANCE_CONTROLLER=$controller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Observe original held responses then health without further acceptance cases
        shell: pwsh
        run: |
          python scripts/acceptance_context.py run-ci --root $env:EINVOICE_ACCEPTANCE_ROOT --controller $env:EINVOICE_ACCEPTANCE_CONTROLLER --action desktop --artifact dist/E-Rechnungs-Pruefer-2.0.3-Windows-x64-Setup.exe --artifact "build/windows/bundle/E-Rechnungs-Pruefer/E-Rechnungs-Pruefer.exe" --artifact .cache/windows-diagnostic/input-binding.json --artifact scripts/windows_package_diagnostic.py --artifact scripts/test_processing_package.py --artifact scripts/test_processing_package.ps1 --artifact scripts/processing_smoke.py --script scripts/test_windows_package.ps1 --evidence .cache/acceptance-logs/desktop-diagnostic.log -- pwsh -NoProfile -File scripts/test_windows_package.ps1 -ConfirmIsolatedEnvironment -Setup dist/E-Rechnungs-Pruefer-2.0.3-Windows-x64-Setup.exe -ProcessingDiagnosticOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify diagnostic evidence
        run: python scripts/acceptance_context.py verify --root $env:EINVOICE_ACCEPTANCE_ROOT
      - name: Preserve original inputs and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
          path: |
            .cache/acceptance/
            .cache/acceptance-logs/
            .cache/windows-diagnostic/
            .cache/dependency-evidence/

  windows-smoke:
    if: inputs.prepare_dependencies != true && inputs.container_only != true && inputs.windows_diagnostic_only != true
    name: Windows package and smoke test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: packaging/windows/requirements-release.txt
      - name: Prepare private CPython security backport
        shell: pwsh
        run: |
          $privatePython = Join-Path $env:RUNNER_TEMP "einvoice-cpython-security"
          python scripts/cpython_security.py clone --destination $privatePython --output .cache/dependency-evidence/cpython-security.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $privatePython | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Create fresh Windows build environment
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$env:GITHUB_WORKSPACE\.venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --force-reinstall
          -r packaging/windows/requirements-release.txt &&
          python -m pip install --no-deps --no-build-isolation -e . &&
          python scripts/dependency_lock.py verify --lock packaging/windows/requirements-release.txt --installed &&
          python -m pip check
      - name: API, PDF, KoSIT, settings and CLI integration tests
        run: >-
          python -m pytest --junitxml=.cache/dependency-evidence/integration-tests.xml
          tests/test_api.py tests/test_pdf.py tests/test_kosit.py
          tests/test_settings.py tests/test_xml_utils.py tests/test_parser_namespaces.py tests/test_validation.py
          tests/test_analysis_schema_v2.py tests/test_assessment_contract.py tests/test_ui_contract.py
          tests/test_frontend_schema_v2.py tests/test_cli.py tests/test_desktop_security.py tests/test_windows_launcher.py
          tests/test_windows_components.py tests/test_api_service_mode.py tests/test_windows_service_browser.py
          tests/test_windows_service_config.py tests/test_windows_service_runtime.py
          tests/test_windows_service_metadata.py
          tests/test_windows_service_packaging.py tests/test_windows_acl.py
          tests/test_windows_install_conflicts.py
          tests/test_windows_install_transaction.py
          tests/test_windows_install_recovery.py tests/test_windows_install_reconcile.py
          tests/test_windows_open_client_transaction.py tests/test_windows_native_adapters.py tests/test_acceptance_context.py tests/test_cpython_security.py tests/test_windows_frozen_runtime.py
          tests/test_upload_ingress.py tests/test_http_upload.py tests/test_http_transport.py
          tests/test_processing_protocol.py tests/test_processing_ready.py tests/test_processing_manager.py
          tests/test_processing_lifecycle.py tests/test_processing_entrypoints.py tests/test_processing_windows.py
          tests/test_processing_python_launcher.py
          tests/test_processing_faults.py
          tests/test_processing_limits.py tests/test_processing_kosit_runtime.py tests/test_processing_probe.py
          tests/test_processing_supervisor.py tests/test_processing_kosit_probe.py
          tests/test_processing_package.py
      - name: Complete native Windows source processing catalog
        shell: pwsh
        run: |
          python scripts/processing_smoke.py --case small --case xml_25mib --case cii_large --case ubl_large --case hybrid_pdf --case parallel --output .cache/dependency-evidence/processing-catalog.json > .cache/dependency-evidence/processing-catalog.stdout 2> .cache/dependency-evidence/processing-catalog.stderr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Active native Windows cancellation and role-death catalog
        shell: pwsh
        run: |
          python scripts/processing_lifecycle_probe.py --output .cache/dependency-evidence/active-lifecycle.json > .cache/dependency-evidence/active-lifecycle.stdout 2> .cache/dependency-evidence/active-lifecycle.stderr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows evidence hashing regression
        run: python -m pytest tests/test_release_evidence.py -k native_evidence_bytes_with_executable_extension_are_read_not_run
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/windows-components
          key: windows-components-${{ hashFiles('packaging/windows/components.lock.json') }}
      - name: Prepare locked Java and KoSIT components
        run: python scripts/prepare_windows_components.py
      - name: Exercise real locked KoSIT engine and Java
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/dependency-evidence | Out-Null
          $lock = Get-Content packaging/windows/components.lock.json -Raw | ConvertFrom-Json
          $archive = Join-Path .cache/windows-components $lock.components.xrechnung.filename
          python scripts/test_kosit_components.py --vendor-root vendor/kosit --java runtime/java/bin/java.exe --config-archive $archive --output .cache/dependency-evidence/kosit.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Calibrate real Java through the bounded processing manager
        timeout-minutes: 7
        shell: pwsh
        run: |
          $lock = Get-Content packaging/windows/components.lock.json -Raw | ConvertFrom-Json
          $archive = Join-Path .cache/windows-components $lock.components.xrechnung.filename
          python scripts/processing_kosit_probe.py --vendor-root vendor/kosit --java runtime/java/bin/java.exe --config-archive $archive --output .cache/dependency-evidence/manager-kosit.json > .cache/dependency-evidence/manager-kosit.stdout 2> .cache/dependency-evidence/manager-kosit.stderr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $compiler = .\scripts\install_inno_setup.ps1
          "EINVOICE_INNO_SETUP_COMPILER=$compiler" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows x64 installer
        id: windows_build
        shell: pwsh
        run: >-
          .\scripts\build_windows.ps1
          -InnoSetupCompiler $env:EINVOICE_INNO_SETUP_COMPILER
          -BuildElevatedRecoveryTestInstaller
      - name: Bind isolated package acceptance before product mutations
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/acceptance, .cache/acceptance-logs | Out-Null
          $root = ".cache/acceptance/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          $controller = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/acceptance_context.py init-ci --root $root --controller $controller --version $version --scope desktop --scope mode-exclusion --scope service-recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "EINVOICE_ACCEPTANCE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EINVOICE_ACCEPTANCE_CONTROLLER=$controller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test installed Windows package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/acceptance_context.py run-ci --root $env:EINVOICE_ACCEPTANCE_ROOT --controller $env:EINVOICE_ACCEPTANCE_CONTROLLER --action desktop --artifact "dist/E-Rechnungs-Pruefer-$version-Windows-x64-Setup.exe" --artifact scripts/test_processing_package.py --artifact scripts/test_processing_package.ps1 --artifact scripts/processing_smoke.py --artifact "build/windows/bundle/E-Rechnungs-Pruefer/E-Rechnungs-Pruefer.exe" --script scripts/test_windows_package.ps1 --evidence .cache/acceptance-logs/desktop.log -- pwsh -NoProfile -File scripts/test_windows_package.ps1 -ConfirmIsolatedEnvironment -Setup "dist/E-Rechnungs-Pruefer-$version-Windows-x64-Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test mutual exclusion of desktop and service modes
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/acceptance_context.py run-ci --root $env:EINVOICE_ACCEPTANCE_ROOT --controller $env:EINVOICE_ACCEPTANCE_CONTROLLER --action mode-exclusion --artifact "dist/E-Rechnungs-Pruefer-$version-Windows-x64-Setup.exe" --artifact "dist/E-Rechnungs-Pruefer-$version-Windows-x64-Dienst-Setup.exe" --script scripts/test_windows_mode_exclusion.ps1 --evidence .cache/acceptance-logs/mode-exclusion.log -- pwsh -NoProfile -File scripts/test_windows_mode_exclusion.ps1 -ConfirmIsolatedEnvironment -DesktopSetup "dist/E-Rechnungs-Pruefer-$version-Windows-x64-Setup.exe" -ServiceSetup "dist/E-Rechnungs-Pruefer-$version-Windows-x64-Dienst-Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installed Windows service package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/acceptance_context.py run-ci --root $env:EINVOICE_ACCEPTANCE_ROOT --controller $env:EINVOICE_ACCEPTANCE_CONTROLLER --action service-recovery --artifact "build/windows/test-installer/E-Rechnungs-Pruefer-$version-Windows-x64-Dienst-Setup.exe" --artifact scripts/test_processing_package.py --artifact scripts/test_processing_package.ps1 --artifact scripts/processing_smoke.py --artifact "build/windows/bundle/E-Rechnungs-Pruefer-Dienst/E-Rechnungs-Pruefer-Dienst.exe" --script scripts/test_windows_service_package.ps1 --evidence .cache/acceptance-logs/service-recovery.log -- pwsh -NoProfile -File scripts/test_windows_service_package.ps1 -ConfirmIsolatedEnvironment -Setup "build/windows/test-installer/E-Rechnungs-Pruefer-$version-Windows-x64-Dienst-Setup.exe" -AllowElevatedRecoveryTestContext -CommitHardKillRecovery Immediate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify package evidence and unchanged dependency inventory
        shell: pwsh
        run: |
          python scripts/acceptance_context.py verify --root $env:EINVOICE_ACCEPTANCE_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dependency_lock.py verify --lock packaging/windows/requirements-release.txt --installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dependency_audit.py capture --lock packaging/windows/requirements-release.txt --output .cache/dependency-evidence/windows-installed.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve bound package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-evidence-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
          path: |
            .cache/acceptance/
            .cache/acceptance-logs/
            .cache/dependency-evidence/
            build/windows/security/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.windows_build.outcome == 'success'
        with:
          name: windows-x64-package-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/*-Windows-x64-Setup.exe
            dist/*-Windows-x64-Dienst-Setup.exe
            dist/*-Windows-x64-Binaries.zip
            dist/*-Windows-x64-SHA256SUMS.txt

  docker:
    if: inputs.prepare_dependencies != true && inputs.windows_diagnostic_only != true
    uses: ./.github/workflows/docker.yml

  prepare-dependencies:
    name: Prepare ${{ matrix.profile }}
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_dependencies == true && inputs.container_only != true && inputs.windows_diagnostic_only != true
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: windows-release
            runner: windows-2022
            lock: packaging/windows/requirements-release.txt
          - profile: source-release
            runner: ubuntu-24.04
            lock: packaging/python/requirements-source-release.txt
          - profile: docker-amd64
            runner: ubuntu-24.04
            lock: packaging/docker/requirements-linux-amd64.txt
          - profile: docker-arm64
            runner: ubuntu-24.04-arm
            lock: packaging/docker/requirements-linux-arm64.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install explicit resolver tools
        run: python -m pip install --upgrade "pip==26.2.1" "packaging==26.3"
      - name: Verify Inno compiler provenance
        if: matrix.profile == 'windows-release'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Inno installer hash mismatch'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'maintenance-inno-7.1.0'
          $process = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',("/DIR=" + $directory) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno setup failed: $($process.ExitCode)" }
          $compiler = Join-Path $directory 'ISCC.exe'
          $receipt = @{
            installer_sha256 = $expected
            compiler_sha256 = (Get-FileHash -Algorithm SHA256 $compiler).Hash.ToLowerInvariant()
            compiler_version = (Get-Item $compiler).VersionInfo.FileVersion
            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
          }
          $receipt | ConvertTo-Json | Set-Content -Encoding utf8 inno-provenance.json
          Get-Content inno-provenance.json
      - name: Resolve complete native wheel lock
        shell: bash
        env:
          LOCK_PROFILE: ${{ matrix.profile }}
          LOCK_OUTPUT: ${{ matrix.lock }}
        run: |
          bootstrap=(--bootstrap pip==26.2.1)
          if [[ "$LOCK_PROFILE" == "windows-release" || "$LOCK_PROFILE" == "source-release" ]]; then
            bootstrap+=(--bootstrap setuptools==84.0.0 --bootstrap wheel==0.48.0)
          fi
          python scripts/dependency_lock.py refresh --profile "$LOCK_PROFILE" --python-version 3.14.7 --output "$LOCK_OUTPUT" "${bootstrap[@]}" --wheelhouse .cache/maintenance-wheels
          python scripts/dependency_lock.py verify --lock "$LOCK_OUTPUT" --wheelhouse .cache/maintenance-wheels
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-lock-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ matrix.lock }}
            ${{ matrix.lock }}.metadata.json
            inno-provenance.json
