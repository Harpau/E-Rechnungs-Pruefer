name: Dependency audit

on:
  schedule:
    - cron: "31 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and audit tool
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Audit installed dependencies
        run: python -m pip_audit --strict .
      - name: Audit locked Windows package dependencies
        run: >-
          python -m pip_audit --strict --disable-pip --require-hashes
          -r packaging/windows/requirements-release.txt
