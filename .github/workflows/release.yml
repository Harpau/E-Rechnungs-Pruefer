name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-release:
    name: Source release artefacts
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload_source.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release ref before running repository code
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -n "${VERSION}"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: pip
      - name: Create fresh build environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - name: Install development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --force-reinstall -r packaging/python/requirements-source-release.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python scripts/dependency_lock.py verify --lock packaging/python/requirements-source-release.txt --installed
          python -m pip check
      - name: Verify tag and quality gate
        shell: bash
        run: |
          python scripts/verify_version.py
          ./scripts/check.sh
      - name: Build release artefacts and audit exact installed inventory
        run: |
          python scripts/build_release.py
          python -m venv "$RUNNER_TEMP/einvoice-wheel-smoke"
          "$RUNNER_TEMP/einvoice-wheel-smoke/bin/python" -m pip install --force-reinstall --require-hashes --only-binary=:all: -r packaging/python/requirements-source-release.txt
          "$RUNNER_TEMP/einvoice-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          mkdir -p .cache/source-evidence
          python scripts/check_source_artifacts.py --dist dist --version "$(cat VERSION)" --wheel-smoke-python "$RUNNER_TEMP/einvoice-wheel-smoke/bin/python" > .cache/source-evidence/artifact-check.json
          python scripts/dependency_lock.py verify --lock packaging/python/requirements-source-release.txt --installed
          python scripts/dependency_audit.py capture --lock packaging/python/requirements-source-release.txt --output .cache/source-evidence/inventory.json
          python scripts/dependency_audit.py audit --inventory .cache/source-evidence/inventory.json --output .cache/source-evidence/audit.json
      - name: Preserve source audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-audit-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 14
          path: .cache/source-evidence/

      - id: upload_source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-release-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: dist/*

  windows-release:
    name: Windows x64 installer
    runs-on: windows-2022
    environment: release
    outputs:
      artifact-id: ${{ steps.upload_windows.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
    env:
      EINVOICE_AZURE_KEY_VAULT_URL: ${{ vars.AZURE_KEY_VAULT_URL }}
      EINVOICE_AZURE_KEY_VAULT_CERTIFICATE: ${{ vars.AZURE_CODE_SIGNING_CERTIFICATE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release ref before running repository code
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "VERSION" -Raw).Trim()
          if (-not $version) {
            throw "VERSION darf nicht leer sein."
          }
          if ($env:GITHUB_EVENT_NAME -eq "push") {
            if ("v$version" -ne $env:GITHUB_REF_NAME) {
              throw "Tag $env:GITHUB_REF_NAME passt nicht zu Version $version."
            }
            $tagType = (git cat-file -t $env:GITHUB_REF_NAME).Trim()
            if ($tagType -ne "tag") {
              throw "Der Release-Tag muss annotiert sein."
            }
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Der Release-Tag zeigt nicht auf einen Commit aus main."
            }
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            if ($env:GITHUB_REF -ne "refs/heads/main") {
              throw "Manuelle Signiertests dürfen nur auf main gestartet werden."
            }
          } else {
            throw "Nicht unterstützter Release-Auslöser: $env:GITHUB_EVENT_NAME"
          }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/windows/requirements-release.txt
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.401"
      - name: Create fresh Windows build environment
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$env:GITHUB_WORKSPACE\.venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install application and Windows build dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --force-reinstall
          -r packaging/windows/requirements-release.txt &&
          python -m pip install --no-deps --no-build-isolation -e . &&
          python scripts/dependency_lock.py verify --lock packaging/windows/requirements-release.txt --installed &&
          python -m pip check
      - name: Verify versions and run Windows integration tests
        shell: pwsh
        run: |
          python scripts/verify_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_api.py tests/test_pdf.py tests/test_kosit.py tests/test_settings.py tests/test_xml_utils.py tests/test_parser_namespaces.py tests/test_validation.py tests/test_analysis_schema_v2.py tests/test_assessment_contract.py tests/test_ui_contract.py tests/test_frontend_schema_v2.py tests/test_cli.py tests/test_desktop_security.py tests/test_windows_launcher.py tests/test_windows_components.py tests/test_api_service_mode.py tests/test_windows_service_browser.py tests/test_windows_service_config.py tests/test_windows_service_runtime.py tests/test_windows_service_metadata.py tests/test_windows_service_packaging.py tests/test_windows_acl.py tests/test_windows_install_conflicts.py tests/test_windows_install_transaction.py tests/test_windows_install_recovery.py tests/test_windows_install_reconcile.py tests/test_windows_open_client_transaction.py tests/test_windows_native_adapters.py tests/test_acceptance_context.py
      - name: Native Windows evidence hashing regression
        run: python -m pytest tests/test_release_evidence.py -k native_evidence_bytes_with_executable_extension_are_read_not_run
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/windows-components
          key: windows-components-${{ hashFiles('packaging/windows/components.lock.json') }}
      - name: Prepare locked Java and KoSIT components
        run: python scripts/prepare_windows_components.py
      - name: Exercise real locked KoSIT engine and Java
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/dependency-evidence | Out-Null
          $lock = Get-Content packaging/windows/components.lock.json -Raw | ConvertFrom-Json
          $archive = Join-Path .cache/windows-components $lock.components.xrechnung.filename
          python scripts/test_kosit_components.py --vendor-root vendor/kosit --java runtime/java/bin/java.exe --config-archive $archive --output .cache/dependency-evidence/kosit.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Authenticate to Azure with OIDC
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install pinned AzureSignTool
        shell: pwsh
        run: |
          $toolDirectory = Join-Path $env:RUNNER_TEMP "azure-sign-tool"
          dotnet tool install AzureSignTool --tool-path $toolDirectory --version 7.0.1
          if ($LASTEXITCODE -ne 0) {
            throw "AzureSignTool konnte nicht installiert werden."
          }
          $tool = Join-Path $toolDirectory "AzureSignTool.exe"
          "EINVOICE_AZURE_SIGN_TOOL=$tool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $compiler = .\scripts\install_inno_setup.ps1
          "EINVOICE_INNO_SETUP_COMPILER=$compiler" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows x64 installer
        shell: pwsh
        run: >-
          .\scripts\build_windows.ps1
          -InnoSetupCompiler $env:EINVOICE_INNO_SETUP_COMPILER
          -BuildElevatedRecoveryTestInstaller
      - name: Bind isolated package acceptance before product mutations
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/acceptance, .cache/acceptance-logs | Out-Null
          $root = ".cache/acceptance/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          $controller = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/acceptance_context.py init-ci --root $root --controller $controller --version $version --scope desktop --scope mode-exclusion --scope service-recovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "EINVOICE_ACCEPTANCE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EINVOICE_ACCEPTANCE_CONTROLLER=$controller" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test installed Windows package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/acceptance_context.py run-ci --root $env:EINVOICE_ACCEPTANCE_ROOT --controller $env:EINVOICE_ACCEPTANCE_CONTROLLER --action desktop --artifact "dist/E-Rechnungs-Pruefer-$version-Windows-x64-Setup.exe" --script scripts/test_windows_package.ps1 --evidence .cache/acceptance-logs/desktop.log -- pwsh -NoProfile -File scripts/test_windows_package.ps1 -RequireSignature -ConfirmIsolatedEnvironment -Setup "dist/E-Rechnungs-Pruefer-$version-Windows-x64-Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test mutual exclusion of desktop and service modes
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/acceptance_context.py run-ci --root $env:EINVOICE_ACCEPTANCE_ROOT --controller $env:EINVOICE_ACCEPTANCE_CONTROLLER --action mode-exclusion --artifact "dist/E-Rechnungs-Pruefer-$version-Windows-x64-Setup.exe" --artifact "dist/E-Rechnungs-Pruefer-$version-Windows-x64-Dienst-Setup.exe" --script scripts/test_windows_mode_exclusion.ps1 --evidence .cache/acceptance-logs/mode-exclusion.log -- pwsh -NoProfile -File scripts/test_windows_mode_exclusion.ps1 -RequireSignature -ConfirmIsolatedEnvironment -DesktopSetup "dist/E-Rechnungs-Pruefer-$version-Windows-x64-Setup.exe" -ServiceSetup "dist/E-Rechnungs-Pruefer-$version-Windows-x64-Dienst-Setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installed Windows service package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/acceptance_context.py run-ci --root $env:EINVOICE_ACCEPTANCE_ROOT --controller $env:EINVOICE_ACCEPTANCE_CONTROLLER --action service-recovery --artifact "build/windows/test-installer/E-Rechnungs-Pruefer-$version-Windows-x64-Dienst-Setup.exe" --script scripts/test_windows_service_package.ps1 --evidence .cache/acceptance-logs/service-recovery.log -- pwsh -NoProfile -File scripts/test_windows_service_package.ps1 -RequireSignature -ConfirmIsolatedEnvironment -Setup "build/windows/test-installer/E-Rechnungs-Pruefer-$version-Windows-x64-Dienst-Setup.exe" -AllowElevatedRecoveryTestContext -CommitHardKillRecovery Immediate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify package evidence and unchanged dependency inventory
        shell: pwsh
        run: |
          python scripts/acceptance_context.py verify --root $env:EINVOICE_ACCEPTANCE_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dependency_lock.py verify --lock packaging/windows/requirements-release.txt --installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dependency_audit.py capture --lock packaging/windows/requirements-release.txt --output .cache/dependency-evidence/windows-installed.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve bound package evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-evidence-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
          path: |
            .cache/acceptance/
            .cache/acceptance-logs/
            .cache/dependency-evidence/
      - name: Inspect all owned executable signatures
        id: inspect_signatures
        shell: pwsh
        run: |
          $version = python scripts/verify_version.py --print
          $internalTestInstaller = "build\windows\test-installer\E-Rechnungs-Pruefer-$version-Windows-x64-Dienst-Setup.exe"
          $ownedFiles = @(
            "build\windows\bundle\E-Rechnungs-Pruefer\E-Rechnungs-Pruefer.exe",
            "build\windows\bundle\E-Rechnungs-Pruefer-Dienst\E-Rechnungs-Pruefer-Dienst.exe",
            "build\windows\bundle\E-Rechnungs-Pruefer-Oeffnen.exe",
            "dist\E-Rechnungs-Pruefer-$version-Windows-x64-Setup.exe",
            "dist\E-Rechnungs-Pruefer-$version-Windows-x64-Dienst-Setup.exe",
            $internalTestInstaller
          )
          foreach ($path in $ownedFiles) {
            $signature = Get-AuthenticodeSignature $path
            Write-Host "$path`: $($signature.Status) / $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne "Valid" -or $null -eq $signature.TimeStamperCertificate) {
              throw "Eigene EXE besitzt keine gültige Authenticode-Signatur mit Zeitstempel: $path"
            }
          }
          if (
            $env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and
            $env:GITHUB_REF -eq "refs/heads/main"
          ) {
            "internal_test_installer=$internalTestInstaller" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      - id: upload_windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*-Windows-x64-Setup.exe
            dist/*-Windows-x64-Dienst-Setup.exe
            dist/*-Windows-x64-Binaries.zip
            dist/*-Windows-x64-SHA256SUMS.txt
      - name: Upload signed internal recovery test installer
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: INTERNAL-TEST-windows-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          path: ${{ steps.inspect_signatures.outputs.internal_test_installer }}

  publish:
    name: Stage draft GitHub release
    needs: [source-release, windows-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.source-release.outputs.artifact-id }}
          path: release-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.windows-release.outputs.artifact-id }}
          path: release-dist
      - name: Stage retry-safe draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if release_state="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "${release_state}" != "true" ]; then
              echo "Für ${GITHUB_REF_NAME} existiert bereits ein veröffentlichtes Release." >&2
              exit 1
            fi
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              --title "E-Rechnungs-Pruefer ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --notes "**Breaking Change seit 2.0.0:** Der bestehende Analyseendpunkt verwendet ausschließlich Analyseschema 2; es gibt keinen Legacy-Adapter. [Migrationsanleitung für Analyseschema 2](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/API_MIGRATION_V2.md) · [Vollständige kuratierte Änderungsübersicht](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
          fi

          shopt -s nullglob
          local_assets=(release-dist/*)
          if [ "${#local_assets[@]}" -eq 0 ]; then
            echo "Es wurden keine Release-Dateien heruntergeladen." >&2
            exit 1
          fi
          existing_assets="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
          while IFS= read -r existing_name; do
            if [ -n "${existing_name}" ] && [ ! -f "release-dist/${existing_name}" ]; then
              echo "Der vorhandene Draft enthält eine unerwartete Datei: ${existing_name}" >&2
              exit 1
            fi
          done <<< "${existing_assets}"

          for asset in "${local_assets[@]}"; do
            asset_name="${asset##*/}"
            if grep -Fqx "${asset_name}" <<< "${existing_assets}"; then
              comparison_dir="$(mktemp -d)"
              gh release download "${GITHUB_REF_NAME}" --pattern "${asset_name}" --dir "${comparison_dir}"
              if ! cmp -s "${asset}" "${comparison_dir}/${asset_name}"; then
                echo "Die vorhandene Draft-Datei weicht vom aktuellen Tag-Build ab: ${asset_name}" >&2
                exit 1
              fi
            else
              gh release upload "${GITHUB_REF_NAME}" "${asset}"
            fi
          done
